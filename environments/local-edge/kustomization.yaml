apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../infra/tailscale
  - ../../infra/nats
  - ../../apps/ingestion
  - ../../apps/ai-worker

secretGenerator:
  - name: ingestion-secrets
    namespace: personal-orchestrator
    envs:
      - .env.secrets
  - name: ai-worker-secrets
    namespace: personal-orchestrator
    envs:
      - .env.secrets
  - name: operator-oauth
    namespace: tailscale
    envs:
      - .env.secrets

generatorOptions:
  disableNameSuffixHash: true
