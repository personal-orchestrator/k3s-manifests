apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: personal-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: localhost/local/ingestion:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: 512Mi
        envFrom:
        - secretRef:
            name: ingestion-secrets
            optional: true
        env:
        - name: NATS_URL
          value: "nats://nats.nats.svc.cluster.local:4222"
        - name: STORAGE_DIR
          value: "/data/recordings"
        - name: USAGE_DIR
          value: "/data/usage"
        - name: HEALTH_DIR
          value: "/data/health"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /var/lib/personal-orchestrator/data
          type: DirectoryOrCreate
