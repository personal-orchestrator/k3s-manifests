apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-worker
  namespace: personal-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcription-worker
  template:
    metadata:
      labels:
        app: transcription-worker
    spec:
      containers:
      - name: transcription-worker
        image: localhost/local/transcription-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: ai-worker-secrets
            optional: true
        env:
        - name: NATS_URL
          value: "nats://nats.nats.svc.cluster.local:4222"
        - name: STORAGE_DIR
          value: "/data/recordings"
        - name: TRANSCRIPTIONS_RAW_DIR
          value: "/data/transcriptions-raw"
        - name: TRANSCRIPTIONS_DIR
          value: "/data/transcriptions"
        - name: GROQ_RATE_LIMIT_PER_MINUTE
          value: "10"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /var/lib/personal-orchestrator/data
          type: DirectoryOrCreate
